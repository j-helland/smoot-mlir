[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "units"
description = "Frontend for the units compiler project."
version = "0.0.0"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "syrupy>=5.1.0",
]
