[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "units"
description = "Frontend for the units compiler project."
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "rich>=15.0.0",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "hypothesis",
    "pytest>=9.0.3",
    "syrupy>=5.1.0",
    "vulture>=2.16",
]

[tool.ruff]
exclude = [
    # generated by MLIR tablegen
    "src/units/dialects/_units_ops_gen.py"
]

[tool.ty.src]
exclude = [
    # generated by MLIR tablegen
    "src/units/dialects/_units_ops_gen.py"
]

[tool.deptry.per_rule_ignores]
# MLIR Python bindings are supplied by Nix through PYTHONPATH.
DEP003 = ["mlir"]
