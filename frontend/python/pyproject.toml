[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "units"
description = "Frontend for the units compiler project."
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "rich>=15.0.0",
    # Only needed for 3.10 support
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.0.3",
    "syrupy>=5.1.0",
    "vulture>=2.16",
]
