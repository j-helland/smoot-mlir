[tools]
ruff = "0.15.12"
ty = "0.0.35"

[settings]
experimental = true

[tasks.test]
depends = ["//:build-backend"]
run = "uv run -- pytest"

[tasks.lint]
depends = [
    "//frontend/python:lint:ruff-check",
    "//frontend/python:lint:ruff-format --check",
    "//frontend/python:lint:typecheck",
    "//frontend/python:lint:deadcode",
]

[tasks."lint:ruff-check"]
usage = """
flag "--fix" help="Auto-apply safe fixes."
"""
run = "ruff check ${usage_fix:+--fix}"

[tasks."lint:ruff-format"]
usage = """
flag "--check" help="Only check if files are already formatted."
"""
run = "ruff format ${usage_check:+--check}"

[tasks."lint:typecheck"]
usage = """
flag "--fix" help="Auto-apply safe fixes."
"""
run = "ty check ${usage_fix:+--fix}"

[tasks."lint:deadcode"]
run = "uv run -- vulture src tests --min-confidence 100"

[tasks.fix]
depends = [
    "//frontend/python:lint:ruff-format",
    "//frontend/python:lint:ruff-check --fix",
    "//frontend/python:lint:typecheck --fix"
]
