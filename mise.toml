experimental_monorepo_root = true

[settings]
experimental = true

[monorepo]
config_roots = [
    "frontend/python/",
    "units-rs/",
]

[env]
UNITS_OPT = "{{config_root}}/build-arm64/tools/units-opt"

[tasks.shell]
description = "Launch the nix development environment for this project."
run = "nix develop -c fish"

[tasks.run]
depends = "//:build-backend"
run = """
mlir-opt \
  --load-pass-plugin=build-arm64/UnitVerifyPass.dylib \
  --pass-pipeline='builtin.module(verify-units)' \
  test.mlir
"""

[tasks.lint]
depends = [
    "//:format-cpp-check",
    "//:tidy-cpp",
    "//frontend/python:lint",
    "//units-rs:lint",
]

[tasks.fix]
description = "Apply formatting and automatic linting fixes where possible."
depends = [
    "//:format-cpp",
    "//frontend/python:fix",
    "//units-rs:fix",
]

[tasks.test]
depends = [
    "//:test-backend",
    "//frontend/python:test",
    "//units-rs:test",
]

[tasks.test-backend]
depends = "//:build-backend"
run = """
cmake \
  --build build-arm64 \
  --target check-units
"""

[tasks.test-backend-sanitizers]
description = "Run backend tests under AddressSanitizer and UBSan"
depends = "//:build-backend-sanitizers"
run = """
cmake \
  --build build-arm64-sanitizers \
  --target check-units
"""

[tasks.build-backend]
run = """
cmake -S . -B build-arm64 \
    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
    -DMLIR_TABLEGEN_EXE_ABSOLUTE="$MLIR_TABLEGEN_EXE"
cmake --build build-arm64
cmake -E touch build-arm64/.mise-build.stamp
"""
# Only execute the task if any of the following have changed:
sources = [
    "CMakeLists.txt",
    "tools/**/*.h",
    "tools/**/*.td",
    "tools/**/*.cpp",
    "tools/**/CMakeLists.txt",
    "lib/**/*.h",
    "lib/**/*.td",
    "lib/**/*.cpp",
    "lib/**/CMakeLists.txt",
    "units-rs/CMakeLists.txt",
    "units-rs/**/*.h",
    "units-rs/**/*.rs",
]
outputs = ["build-arm64/.mise-build.stamp"]

[tasks.build-backend-sanitizers]
description = "Build the C++ backend with AddressSanitizer and UBSan"
run = """
cmake -S . -B build-arm64-sanitizers \
    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
    -DMLIR_TABLEGEN_EXE_ABSOLUTE="$MLIR_TABLEGEN_EXE" \
    -DCMAKE_BUILD_TYPE=Debug \
    -DUNITS_ENABLE_ASAN=ON \
    -DUNITS_ENABLE_UBSAN=ON
cmake --build build-arm64-sanitizers
cmake -E touch build-arm64-sanitizers/.mise-build.stamp
"""
sources = [
    "CMakeLists.txt",
    "tools/**/*.h",
    "tools/**/*.td",
    "tools/**/*.cpp",
    "tools/**/CMakeLists.txt",
    "lib/**/*.h",
    "lib/**/*.td",
    "lib/**/*.cpp",
    "lib/**/CMakeLists.txt",
    "mlir-tests/**/*",
    "unittests/**/*.cpp",
    "unittests/**/CMakeLists.txt",
]
outputs = ["build-arm64-sanitizers/.mise-build.stamp"]

[tasks.format-cpp]
description = "Format C++ and TableGen files with clang-format"
run = """
"$CLANG_FORMAT_EXE" -i $(git ls-files '*.h' '*.cpp' '*.td')
"""

[tasks.format-cpp-check]
description = "Check C++ and TableGen formatting"
run = """
"$CLANG_FORMAT_EXE" --dry-run --Werror $(git ls-files '*.h' '*.cpp' '*.td')
"""

[tasks.tidy-cpp]
description = "Run clang-tidy over C++ translation units"
depends = "//:build-backend"
run = """
"$CLANG_TIDY_EXE" -quiet -p build-arm64 \
  $(git ls-files 'lib/**/*.cpp' 'tools/**/*.cpp' 'unittests/**/*.cpp')
"""
