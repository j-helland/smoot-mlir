[tasks.build]
run = """
cmake -S . -B build-arm64 \
      -DMLIR_DIR=~/llvm-project/build-arm64/lib/cmake/mlir \
      -DCMAKE_OSX_ARCHITECTURES=arm64 \
      -DCMAKE_C_COMPILER=/usr/bin/clang \
      -DCMAKE_CXX_COMPILER=/usr/bin/clang++
cmake --build build-arm64
"""

[tasks.run]
depends = "build"
run = """
mlir-opt \
      --load-pass-plugin=build-arm64/UnitVerifyPass.dylib \
      --pass-pipeline='builtin.module(verify-units)' \
      test.mlir
"""
