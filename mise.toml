monorepo_root = true

[tools]
ruff = "0.17.1"
ty = "0.0.89"

[settings]
experimental = true

[monorepo]
config_roots = ["frontend/python/", "units-rs/"]

[env]
UV_FROZEN = true

[tasks.shell]
description = "Launch the nix development environment for this project."
run = "nix develop -c $SHELL"

[tasks.run]
depends = "//:build-backend"
run = """
mlir-opt \
  --load-pass-plugin=build/UnitVerifyPass.dylib \
  --pass-pipeline='builtin.module(verify-units)' \
  test.mlir
"""

[tasks.check-all]
depends = ["//:lint", "//:test", "//:test-backend-sanitizers"]

[tasks.lint]
depends = [
  "//:format-cpp-check",
  "//:tidy-cpp",
  "//frontend/python:lint",
  "//units-rs:lint",
]

[tasks.fix]
description = "Apply formatting and automatic linting fixes where possible."
depends = ["//:format-cpp", "//frontend/python:fix", "//units-rs:fix"]

[tasks.test]
depends = ["//:test-backend", "//frontend/python:test", "//units-rs:test"]

[tasks.test-backend]
depends = "//:build-backend"
run = """
cmake \
  --build build \
  --target check-units
"""

[tasks.test-backend-sanitizers]
description = "Run backend tests under AddressSanitizer and UBSan"
depends = "//:build-backend-sanitizers"
run = """
cmake \
  --build build-sanitizers \
  --target check-units
"""

[tasks.build-backend]
run = """
PYTHON_EXE="${PYTHON_EXE:-$(uv run --package devtools -- python -c 'import sys; print(sys.executable)')}"
PYBIND11_DIR="${PYBIND11_DIR:-$(uv run --package devtools -- python -m pybind11 --cmakedir)}"
LIT_EXE="${LIT_EXE:-$(uv run --package devtools -- python -c 'import shutil; print(shutil.which("lit"))')}"

cmake -S . -B build \
    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
    -DCMAKE_C_COMPILER="$CC" \
    -DCMAKE_CXX_COMPILER="$CXX" \
    -DCMAKE_AR="$AR" \
    -DCMAKE_RANLIB="$RANLIB" \
    -DCMAKE_NM="$NM" \
    -DMLIR_TABLEGEN_EXE_ABSOLUTE="$MLIR_TABLEGEN_EXE" \
    -DPython_EXECUTABLE="$PYTHON_EXE" \
    -Dpybind11_DIR="$PYBIND11_DIR" \
    -DLIT_EXECUTABLE="$LIT_EXE"
cmake --build build
cmake -E touch build/.mise-build.stamp
"""
# Only execute the task if any of the following have changed:
sources = [
  "mise.toml",
  "pyproject.toml",
  "devtools/python/pyproject.toml",
  "frontend/python/pyproject.toml",
  "uv.lock",
  "CMakeLists.txt",
  "tools/**/*.h",
  "tools/**/*.td",
  "tools/**/*.cpp",
  "tools/**/CMakeLists.txt",
  "lib/**/*.h",
  "lib/**/*.td",
  "lib/**/*.cpp",
  "lib/**/CMakeLists.txt",
  "units-rs/CMakeLists.txt",
  "units-rs/**/*.h",
  "units-rs/**/*.rs",
  "bindings/**/CMakeLists.txt",
  "bindings/**/*.h",
  "bindings/**/*.cpp",
]
outputs = ["build/.mise-build.stamp"]

[tasks.build-backend-sanitizers]
description = "Build the C++ backend with AddressSanitizer and UBSan"
run = """
PYTHON_EXE="${PYTHON_EXE:-$(uv run --package devtools -- python -c 'import sys; print(sys.executable)')}"
PYBIND11_DIR="${PYBIND11_DIR:-$(uv run --package devtools -- python -m pybind11 --cmakedir)}"
LIT_EXE="${LIT_EXE:-$(uv run --package devtools -- python -c 'import shutil; print(shutil.which("lit"))')}"

cmake -S . -B build-sanitizers \
    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
    -DCMAKE_C_COMPILER="$CC" \
    -DCMAKE_CXX_COMPILER="$CXX" \
    -DCMAKE_AR="$AR" \
    -DCMAKE_RANLIB="$RANLIB" \
    -DCMAKE_NM="$NM" \
    -DMLIR_TABLEGEN_EXE_ABSOLUTE="$MLIR_TABLEGEN_EXE" \
    -DPython_EXECUTABLE="$PYTHON_EXE" \
    -Dpybind11_DIR="$PYBIND11_DIR" \
    -DLIT_EXECUTABLE="$LIT_EXE" \
    -DCMAKE_BUILD_TYPE=Debug \
    -DUNITS_ENABLE_ASAN=ON \
    -DUNITS_ENABLE_UBSAN=ON
cmake --build build-sanitizers
cmake -E touch build-sanitizers/.mise-build.stamp
"""
sources = [
  "mise.toml",
  "pyproject.toml",
  "devtools/python/pyproject.toml",
  "frontend/python/pyproject.toml",
  "uv.lock",
  "CMakeLists.txt",
  "tools/**/*.h",
  "tools/**/*.td",
  "tools/**/*.cpp",
  "tools/**/CMakeLists.txt",
  "lib/**/*.h",
  "lib/**/*.td",
  "lib/**/*.cpp",
  "lib/**/CMakeLists.txt",
  "units-rs/**/*.h",
  "units-rs/**/*.rs",
  "mlir-tests/**/*",
  "unittests/**/*.cpp",
  "unittests/**/CMakeLists.txt",
]
outputs = ["build-sanitizers/.mise-build.stamp"]

[tasks.format-cpp]
description = "Format C++ and TableGen files with clang-format"
run = """
"$CLANG_FORMAT_EXE" -i $(
    git ls-files \
        '*.h' '*.cpp' '*.td' \
        ':(exclude)units-rs/include/units_rs.h'
)
"""

[tasks.format-cpp-check]
description = "Check C++ and TableGen formatting"
run = """
"$CLANG_FORMAT_EXE" --dry-run --Werror $(
    git ls-files \
        '*.h' '*.cpp' '*.td' \
        ':(exclude)units-rs/include/units_rs.h'
)
"""

[tasks.tidy-cpp]
description = "Run clang-tidy over C++ translation units"
depends = "//:build-backend"
run = """
"$CLANG_TIDY_EXE" -quiet -p build $(
    git ls-files \
        'lib/**/*.cpp' \
        'tools/**/*.cpp' \
        'bindings/**/*.cpp' \
        'unittests/**/*.cpp'
)
"""
