[tasks.build]
run = """
cmake -S . -B build-arm64 \
    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
cmake --build build-arm64
"""

[tasks.run]
depends = "build"
run = """
mlir-opt \
  --load-pass-plugin=build-arm64/UnitVerifyPass.dylib \
  --pass-pipeline='builtin.module(verify-units)' \
  test.mlir
"""

[tasks.test]
depends = [
    "test-compiler",
    "test-python-frontend",
]

[tasks.test-compiler]
depends = "build"
run = """
cmake \
  --build build-arm64 \
  --target check-units
"""

[tasks.test-python-frontend]
dir = "frontend/python"
run = """
uv run -- pytest
"""
