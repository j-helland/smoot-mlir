[env]
UNITS_OPT = "{{config_root}}/build-arm64/tools/units-opt"

[tasks.build-backend]
run = """
cmake -S . -B build-arm64 \
    -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
cmake --build build-arm64
cmake -E touch build-arm64/.mise-build.stamp
"""
# Only execute the task if any of the following have changed:
sources = [
    "CMakeLists.txt",
    "tools/**/*.h",
    "tools/**/*.td",
    "tools/**/*.cpp",
    "tools/**/CMakeLists.txt",
    "lib/**/*.h",
    "lib/**/*.td",
    "lib/**/*.cpp",
    "lib/**/CMakeLists.txt",
]
outputs = ["build-arm64/.mise-build.stamp"]

[tasks.run]
depends = "build-backend"
run = """
mlir-opt \
  --load-pass-plugin=build-arm64/UnitVerifyPass.dylib \
  --pass-pipeline='builtin.module(verify-units)' \
  test.mlir
"""

[tasks.test]
depends = [
    "test-backend",
    "test-python-frontend",
]

[tasks.test-backend]
depends = "build-backend"
run = """
cmake \
  --build build-arm64 \
  --target check-units
"""

[tasks.test-python-frontend]
dir = "frontend/python"
run = "mise run test"
